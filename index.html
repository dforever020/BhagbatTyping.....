<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A R TYPING MASTER - BSF HCM TEST</title>
<style>
    :root {
        --primary-color: #003366;
        --secondary-color: #0056b3;
        --bg-color: #f4f7f6;
        --correct-color: #28a745;
        --wrong-color: #dc3545;
        --current-color: #ffc107;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .header {
        text-align: center;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .header h1 {
        color: var(--primary-color);
        margin: 0;
        font-size: 26px;
    }

    .controls-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        background: #eef2f5;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
    }

    .control-group label {
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 5px;
        color: #333;
    }

    select, input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .stats-bar {
        display: flex;
        justify-content: space-around;
        background: var(--primary-color);
        color: #fff;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .passage-box {
        height: 180px;
        overflow-y: auto;
        border: 2px solid #ccc;
        padding: 15px;
        font-size: 18px;
        line-height: 1.6;
        border-radius: 6px;
        background: #fafafa;
        margin-bottom: 15px;
        white-space: pre-wrap;
        word-wrap: break-word;
        user-select: none;
    }

    .char {
        position: relative;
    }

    .char.correct {
        color: var(--correct-color);
        background-color: #e8f5e9;
    }

    .char.wrong {
        color: var(--wrong-color);
        background-color: #ffebee;
        text-decoration: underline;
    }

    .char.current {
        background-color: var(--current-color);
        border-radius: 2px;
    }

    .typing-area {
        width: 100%;
        height: 120px;
        font-size: 18px;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid var(--primary-color);
        border-radius: 6px;
        resize: none;
        outline: none;
    }

    .btn-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    button {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-start { background-color: var(--primary-color); color: #fff; }
    .btn-start:hover { background-color: var(--secondary-color); }
    .btn-reset { background-color: #6c757d; color: #fff; }

    /* Result Modal */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        width: 450px;
        text-align: center;
    }

    .modal-content h2 { color: var(--primary-color); margin-top: 0; }

    .result-table {
        width: 100%;
        margin: 20px 0;
        border-collapse: collapse;
    }

    .result-table td {
        padding: 8px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    .result-table td:last-child {
        text-align: right;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>A R TYPING MASTER</h1>
        <small>BSF HCM TYPING TEST EXAM PORTAL</small>
    </div>

    <div class="controls-grid">
        <div class="control-group">
            <label for="passageSelect">Select Test Passage:</label>
            <select id="passageSelect"></select>
        </div>

        <div class="control-group">
            <label for="timeLimit">Timer Options:</label>
            <select id="timeLimit" onchange="toggleCustomTime()">
                <option value="1">1 Minute</option>
                <option value="2">2 Minutes</option>
                <option value="5" selected>5 Minutes</option>
                <option value="10">10 Minutes</option>
                <option value="30">30 Minutes (Max)</option>
                <option value="custom">Custom Time</option>
            </select>
        </div>

        <div class="control-group" id="customTimeGroup" style="display:none;">
            <label for="customTime">Custom Minutes (Max 30):</label>
            <input type="number" id="customTime" min="0.5" max="30" step="0.5" value="5">
        </div>

        <div class="control-group">
            <label for="backspaceOpt">Backspace Settings:</label>
            <select id="backspaceOpt">
                <option value="allowed">Backspace Allowed</option>
                <option value="disabled">Backspace Disabled</option>
            </select>
        </div>
    </div>

    <div class="stats-bar">
        <div>Time Left: <span id="timer">05:00</span></div>
        <div>Gross WPM: <span id="grossWpm">0</span></div>
        <div>Accuracy: <span id="accuracy">100%</span></div>
        <div>Errors: <span id="errors">0</span></div>
    </div>

    <div class="passage-box" id="passageBox"></div>

    <textarea class="typing-area" id="typingArea" placeholder="Click 'Start Test' button to begin..." disabled></textarea>

    <div class="btn-container">
        <button class="btn-start" id="startBtn" onclick="startTest()">Start Test</button>
        <button class="btn-reset" onclick="resetTest()">Reset Test</button>
    </div>
</div>

<!-- Modal Results Window -->
<div class="modal" id="resultModal">
    <div class="modal-content">
        <h2>BSF HCM Typing Result</h2>
        <table class="result-table">
            <tr><td>Total Time Taken:</td><td id="resTime">0 mins</td></tr>
            <tr><td>Total Keystrokes:</td><td id="resKeys">0</td></tr>
            <tr><td>Gross Speed (WPM):</td><td id="resGross">0</td></tr>
            <tr><td>Net Speed (WPM):</td><td id="resNet">0</td></tr>
            <tr><td>Accuracy:</td><td id="resAcc">0%</td></tr>
            <tr><td>Total Errors:</td><td id="resErrors">0</td></tr>
        </table>
        <button class="btn-start" onclick="closeResult()">Close</button>
    </div>
</div>

<script>
const passages = [

        text: `The skill of typing has evolved from a specialized mechanical task into a fundamental pillar of modern communication and productivity that defines how we interact with the world around us. In our current digital landscape, the ability to translate thoughts into text quickly and accurately is essential for everything from professional correspondence and academic research to personal social interaction and creative expression. Mastering the keyboard through the dedicated practice of touch typing allows an individual to move past the physical limitations of the hardware, enabling a seamless flow of ideas directly onto the screen without the distraction of looking down at their hands. This proficiency not only saves a significant amount of time over the course of a day but also reduces the cognitive load required to operate a computer, letting the user focus entirely on the quality, tone, and creativity of their message rather than the location of individual letters. As we continue to integrate technology into every aspect of our lives, typing remains the primary bridge between human intent and digital execution, serving as a vital literacy skill that empowers people to navigate the information age with confidence and ease. Beyond mere speed, the art of typing involves a deep connection between the mind and the muscles of the fingers, creating a rhythmic movement that can become almost meditative when a writer is in a state of flow. This physical connection to language allows for a unique form of reflection where the speed of the fingers matches the speed of thought, ensuring that no insight is lost in the transition from brain to binary code. Even as voice recognition technology improves, typing offers a level of privacy, precision, and quiet focus that speaking aloud cannot replicate, making it an irreplaceable tool for those who work in shared spaces or handle sensitive information. The history of the keyboard itself, moving from the heavy mechanical levers of the early twentieth century to the haptic glass of modern smartphones, mirrors the rapid advancement of human civilization and our constant desire for faster and more efficient ways to share knowledge. By investing time in learning proper form and ergonomics, a typist protects their long term health while gaining a superpower that increases their value in the workplace and their ability to stay connected with friends and family across the globe. Whether one is coding complex software, drafting a heartfelt letter, or simply searching for answers to life's many questions, the humble act of typing serves as the foundational interface of the modern era. It is a skill that bridges generations, allowing an older professional to mentor a young student and enabling global collaborations that were once thought impossible. As digital devices become even more portable and integrated into our clothing and surroundings, the fundamental concept of character input remains the gold standard for accuracy. Even the layout of the keys, which has remained largely unchanged for over a century, stands as a testament to the enduring nature of this human machine interface. Learning to type well is not just about vocational training; it is about reclaiming time and reducing the friction between a person and their goals. Every keystroke is a choice and every sentence is a step toward a more connected future where ideas are the most valuable currency. By honing this craft, we ensure that our digital voices are heard clearly and that our contributions to the global conversation are limited only by our imaginations rather than our technical abilities. The impact of high speed typing is felt most deeply during intense periods of work where deadlines are tight and the pressure to perform is high, as the skilled typist can produce high volumes of text without the physical fatigue that plagues those who hunt and peck. This efficiency ripples outward, affecting overall organizational productivity and personal well being.`

        title: "BSF HCM TYPING TEST-2",
        text: `Eating a balanced and healthy diet is one of the most important things you can do to take care of your body and mind. In our busy world, it is often tempting to reach for fast food or prepackaged snacks because they are convenient and taste good. However, what we put into our bodies acts as fuel, and the quality of that fuel determines how well we can perform our daily tasks. Understanding the basics of nutrition and making small, consistent changes can lead to a much longer and happier life. When we talk about healthy eating, we do not mean strict diets that leave you feeling hungry or unhappy. Instead, it is about finding a balance that provides your body with the vitamins and minerals it needs to stay strong and fight off illness One of the main benefits of healthy eating is the boost in energy levels. Many people rely on sugary drinks or caffeine to get through the day, but these often lead to a crash later on. Complex carbohydrates, such as whole grains, oats, and brown rice, release energy slowly throughout the day. This means you can stay focused at work or school without feeling tired in the afternoon. Along with energy, a good diet helps with weight management. Maintaining a healthy weight reduces the pressure on your heart and joints, making it easier to stay active as you get older. By choosing whole foods over processed ones, you naturally consume fewer calories while feeling more satisfied. Physical health is only one part of the story, as nutrition also plays a huge role in mental well-being. Recent studies have shown that there is a strong connection between the gut and the brain. Eating plenty of fruits, vegetables, and healthy fats can improve your mood and reduce feelings of stress. Foods rich in omega three fatty acids, such as fish or walnuts, are particularly good for brain health and memory. When you eat well, you are likely to sleep better, which in turn helps you handle the challenges of daily life with a calmer and more positive attitude. It is amazing how much a simple change in your meals can change the way you see the world. Another critical reason to focus on healthy eating is the prevention of long term diseases. A diet high in salt, sugar, and saturated fats is a leading cause of heart disease, type two diabetes, and high blood pressure. By filling your plate with colorful vegetables and lean proteins, you are building a defense system for your body. Many vegetables contain antioxidants that protect your cells from damage. Over time, these healthy choices add up, significantly lowering your risk of ending up in the hospital. It is much easier to prevent health problems through good food now than it is to treat them with medicine later in life. For many people, the biggest challenge to healthy eating is the cost or the time required for cooking. However, eating well does not have to be expensive or complicated. Buying seasonal produce is often much cheaper than buying out of season items. Additionally, staple foods like beans, lentils, and eggs are very affordable and packed with nutrition. Preparing meals at home also gives you complete control over the ingredients, allowing you to avoid hidden sugars and excessive salt that are common in restaurant food. You can start by making simple swaps, like choosing water over soda or fruit over a candy bar. These small steps are much more effective than trying to change everything at once Healthy eating is also a wonderful way to bring people together. Sharing a home cooked meal with friends or family creates a sense of community and joy. It provides an opportunity to slow down and appreciate the flavors of fresh food. Teaching children about nutrition from a young age is one of the greatest gifts a parent can give. When kids learn to enjoy a variety of foods, they develop habits that will keep them healthy for the rest of their lives. It is about creating a culture of wellness that values quality and balance over quick fixes and fads.`

quent discussion raised questions about the independence of some of the 'peer-reviewed publications' cited in the case. In his final ruling in Daubert, Judge Kozinski argued that peerreviewed publication is as good an indication of scientific reliability as we can hope for. However, I believe this underestimates the complexity of peer review in fields affected by litigation or commercial interests. Dr Brent, expert witness for the manufacturers, insisted that if Bendectin were teratogenic (defect-forming), then after it was taken off the US market the rate of birth defects would have been higher in Canada, where it remained available, than in the US - and this wasn't seen. However, obstetricians had long realized that you could mimic the effects of Bendectin by taking a vitamin B6 pill and half a Unisom tablet. If Bendectin was harmful, then this widely-used substitute which mimicked the drug's effects could potentially have masked such a difference between the two countries, raising doubts about this line of reasoning. To my surprise, in 2013 the drug returned to the US market, now made by a Canadian company under the name Diclegis. The FDA had never withdrawn its approval for Bendectin, so the company had only to prove that the drug was effective. I checked: how had they done this? They had studied the effects of the drug on a very small sample of around two hundred women, for whom it was being prescribed only for 'mild to moderate morning sickness'.`
